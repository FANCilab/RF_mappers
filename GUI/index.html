<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RF Figures</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #657085; --line: #e1e5ec;
    --accent: #2f6fde; --accent-soft: #e6eefc; --good: #1d8a4e; --good-soft: #e3f4ea; --shadow: 0 1px 3px rgba(20, 30, 50, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b2029; --ink: #e6e9ef; --muted: #9099a8; --line: #2b313d;
      --accent: #6f9dff; --accent-soft: #23314d; --good: #5fd08f; --good-soft: #1f3a2b; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 290px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 18px 12px; }
  aside h1 { font-size: 17px; margin: 0 8px 2px; }
  aside .sub { color: var(--muted); font-size: 12px; margin: 0 8px 14px; }
  .item { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none; color: inherit;
          font: inherit; padding: 9px 10px; border-radius: 9px; cursor: pointer; margin-bottom: 2px; }
  .item:hover { background: var(--bg); }
  .item.active { background: var(--accent-soft); border-color: var(--accent); }
  .item .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .item b { font-weight: 600; }
  .item .meta { color: var(--muted); font-size: 12px; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--bg); color: var(--muted); white-space: nowrap; }
  .badge.good { background: var(--good-soft); color: var(--good); font-weight: 600; }
  .all { margin-bottom: 12px; }
  main { overflow-y: auto; padding: 18px 24px 40px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; position: sticky; top: -18px; z-index: 2;
             background: var(--bg); padding: 12px 0; margin: -18px 0 8px; }
  .group { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel); }
  .group button { border: 0; border-right: 1px solid var(--line); background: none; color: var(--ink); font: inherit;
                  padding: 6px 12px; cursor: pointer; }
  .group button:last-child { border-right: 0; }
  .group button.on { background: var(--accent); color: #fff; }
  .group button:disabled { color: var(--muted); opacity: .45; cursor: default; }
  .toggle { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
  .toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; margin-left: auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .card header { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .card header h2 { font-size: 15px; margin: 0; }
  .card header .meta { color: var(--muted); font-size: 12px; }
  .card header a { margin-left: auto; color: var(--accent); font-size: 12px; text-decoration: none; }
  .card header a + a { margin-left: 10px; }
  .figure { display: flex; justify-content: center; padding: 10px; background: #fff; cursor: zoom-in; }
  .figure img { max-width: 100%; max-height: calc(100vh - 210px); object-fit: contain; }
  .missing { padding: 60px 20px; text-align: center; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; }
  .grid .card { cursor: pointer; }
  .grid .card:hover { border-color: var(--accent); }
  .grid .figure { cursor: pointer; }
  .grid .figure img { max-height: 380px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 28px 0 10px; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .thumb { background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 6px; cursor: zoom-in; text-align: center; }
  .thumb img { width: 100%; height: 150px; object-fit: contain; }
  .thumb span { display: block; font-size: 11px; color: #555; }
  .lightbox { position: fixed; inset: 0; background: rgba(8, 10, 14, .9); display: none; z-index: 10;
              align-items: center; justify-content: center; flex-direction: column; gap: 10px; padding: 20px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 96vw; max-height: 88vh; background: #fff; border-radius: 6px; }
  .lightbox .bar { color: #dfe3ea; font-size: 13px; display: flex; gap: 16px; align-items: center; }
  .lightbox a { color: #9cc0ff; }
  .lightbox button { position: absolute; top: 14px; right: 18px; background: none; border: 0; color: #fff; font-size: 28px; cursor: pointer; }
  .loading { padding: 40px; color: var(--muted); }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; }
    main { padding: 16px; }
    .grid { grid-template-columns: 1fr; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>RF figures</h1>
    <div class="sub" id="summary">Loading…</div>
    <div id="sessions"></div>
  </aside>
  <main id="main"><div class="loading">Loading figures…</div></main>
</div>
<div class="lightbox" id="lightbox">
  <button aria-label="Close" onclick="closeLightbox()">×</button>
  <img id="lightbox-img" alt="">
  <div class="bar"><span id="lightbox-caption"></span><a id="lightbox-png" target="_blank">PNG</a><a id="lightbox-svg">SVG</a></div>
</div>
<script>
// Figure types of the toolbar: file name at session (combined FOVs) and FOV level; overlays have a "Good" version
const TYPES = [
  {key: "centre", label: "RF centre", session: "rfRoiOverlay", fov: "rfRoiOverlay", good: true},
  {key: "azimuth", label: "Azimuth", session: "rfAzimuthOverlay", fov: "rfAzimuthOverlay", good: true},
  {key: "elevation", label: "Elevation", session: "rfElevationOverlay", fov: "rfElevationOverlay", good: true},
  {key: "coverage", label: "Coverage", session: "gaussianCoverage", fov: "gaussianCoverage"},
  {key: "rois", label: "ROIs", session: "neuronOverlays", fov: "roiOverlays"},
  {key: "size", label: "RF size", session: "rfSize", fov: "rfSizeHistogram"},
  {key: "ev", label: "Expl. variance", session: "evLines", fov: "evHistogram"},
];
const EXTRA_GROUPS = [["rfMaps/good/", "RF maps, good"], ["rfMaps/significant/", "RF maps, significant"],
                      ["predictedVsActual/", "Predicted vs actual"], ["peakTimeCourses", "Peak time courses"]];
let data, sessions = {}, byKey = {};
let state = {session: "all", type: "centre", good: false, scope: "session"};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const url = path => "/fig/" + path.split("/").map(encodeURIComponent).join("/");
const typeOf = key => TYPES.find(t => t.key === key);

function figureName(type, scope, good) {
  const t = typeOf(type);
  return (scope === "session" ? t.session : t.fov) + (t.good && good ? "Good" : "");
}
function find(session, scope, name) { return byKey[`${session}|${scope}|${name}`]; }
function scopeLabel(scope) { return scope === "session" ? "Combined FOVs" : scope; }

function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("session") && (p.get("session") === "all" || sessions[p.get("session")])) state.session = p.get("session");
  if (p.get("type") && typeOf(p.get("type"))) state.type = p.get("type");
  state.good = p.get("good") === "1";
  if (p.get("scope")) state.scope = p.get("scope");
}
function writeHash() {
  const p = new URLSearchParams({session: state.session, type: state.type, good: state.good ? "1" : "0", scope: state.scope});
  history.replaceState(null, "", "#" + p);
}
function set(changes) { Object.assign(state, changes); render(); }

function sessionMeta(s) {
  const counts = s.good !== undefined ? `<span class="badge ${s.good ? "good" : ""}">${s.significant} sig · ${s.good} good</span>` : "";
  return {counts, text: esc(s.preprocessing || "")};
}

function renderSidebar() {
  const list = data.sessions.map(s => {
    const [subject, date, number] = s.session.split("/");
    const m = sessionMeta(s);
    return `<button class="item ${state.session === s.session ? "active" : ""}" data-session="${esc(s.session)}">
      <div class="top"><b>${esc(subject)}</b>${m.counts}</div>
      <div class="meta">${esc(date)} · #${esc(number)} · ${s.fovs.length} FOV${s.fovs.length > 1 ? "s" : ""}</div>
      <div class="meta">${m.text}</div></button>`;
  }).join("");
  $("sessions").innerHTML = `<button class="item all ${state.session === "all" ? "active" : ""}" data-session="all">
      <div class="top"><b>All sessions</b><span class="badge">compare</span></div>
      <div class="meta">Selected figure side by side, combined FOVs</div></button>` + list;
  for (const b of $("sessions").querySelectorAll(".item")) b.onclick = () => set({session: b.dataset.session, scope: "session"});
}

function toolbar() {
  const scopes = state.session === "all" ? [] : ["session", ...sessions[state.session].fovs];
  const goodOk = typeOf(state.type).good;
  return `<div class="toolbar">
    <div class="group">${TYPES.map(t => `<button data-type="${t.key}" class="${t.key === state.type ? "on" : ""}">${t.label}</button>`).join("")}</div>
    <label class="toggle" style="${goodOk ? "" : "opacity:.4"}"><input type="checkbox" id="good" ${state.good ? "checked" : ""} ${goodOk ? "" : "disabled"}> Good RFs only</label>
    ${scopes.length > 1 ? `<div class="group">${scopes.map(s => `<button data-scope="${s}" class="${s === state.scope ? "on" : ""}">${scopeLabel(s)}</button>`).join("")}</div>` : ""}
    <span class="hint">↑↓ session · ←→ figure · G good · Esc close</span>
  </div>`;
}

function figureCard(session, scope, title, clickable) {
  const fig = find(session, scope, figureName(state.type, scope, state.good));
  const s = sessions[session];
  const meta = `${scopeLabel(scope)}${s.preprocessing ? " · " + esc(s.preprocessing) : ""}${fig ? " · rev " + esc(fig.revision) : ""}`;
  const links = fig ? `<a href="${url(fig.png)}" target="_blank" onclick="event.stopPropagation()">PNG</a>${fig.svg ? `<a href="${url(fig.svg)}?download" onclick="event.stopPropagation()">SVG</a>` : ""}` : "";
  const body = fig ? `<div class="figure" data-png="${esc(fig.png)}"><img loading="lazy" src="${url(fig.png)}" alt="${esc(title)}"></div>`
                   : `<div class="missing">No ${esc(typeOf(state.type).label)} figure${state.good ? " (good RFs only)" : ""} for this selection</div>`;
  return `<div class="card" ${clickable ? `data-open="${esc(session)}"` : ""}><header><h2>${esc(title)}</h2>
    <span class="meta">${meta}</span>${sessionMeta(s).counts}${links}</header>${body}</div>`;
}

function extras(session, scope) {
  const main = new Set(TYPES.flatMap(t => [t.session, t.fov, t.session + "Good", t.fov + "Good"]));
  const figs = data.figures.filter(f => f.session === session && f.scope === scope && !main.has(f.name));
  return EXTRA_GROUPS.map(([prefix, label]) => {
    const group = figs.filter(f => f.name.startsWith(prefix));
    if (!group.length) return "";
    return `<h3>${label} (${group.length})</h3><div class="thumbs">${group.map(f =>
      `<div class="thumb" data-png="${esc(f.png)}"><img loading="lazy" src="${url(f.png)}" alt=""><span>${esc(f.name.split("/").pop())}</span></div>`).join("")}</div>`;
  }).join("");
}

function render() {
  if (state.session !== "all" && !["session", ...sessions[state.session].fovs].includes(state.scope)) state.scope = "session";
  writeHash();
  renderSidebar();
  let html = toolbar();
  if (state.session === "all") {
    html += `<div class="grid">${data.sessions.map(s => figureCard(s.session, "session", s.session, true)).join("")}</div>`;
  } else {
    html += figureCard(state.session, state.scope, state.session, false);
    if (state.scope !== "session") html += extras(state.session, state.scope);
    else html += `<h3>Per-FOV figures</h3><div class="meta" style="color:var(--muted)">Choose a FOV above for RF maps, predicted vs actual traces and peak time courses.</div>`;
  }
  $("main").innerHTML = html;
  for (const b of document.querySelectorAll("[data-type]")) b.onclick = () => set({type: b.dataset.type});
  for (const b of document.querySelectorAll("[data-scope]")) b.onclick = () => set({scope: b.dataset.scope});
  const good = $("good"); if (good) good.onchange = () => set({good: good.checked});
  for (const c of document.querySelectorAll("[data-open]")) c.onclick = () => set({session: c.dataset.open, scope: "session"});
  if (state.session !== "all") for (const f of document.querySelectorAll("[data-png]")) f.onclick = () => openLightbox(f.dataset.png);
}

function openLightbox(png) {
  const fig = data.figures.find(f => f.png === png);
  $("lightbox-img").src = url(png);
  $("lightbox-caption").textContent = `${fig.session} · ${scopeLabel(fig.scope)} · ${fig.name}`;
  $("lightbox-png").href = url(png);
  $("lightbox-svg").style.display = fig.svg ? "" : "none";
  if (fig.svg) $("lightbox-svg").href = url(fig.svg) + "?download";
  $("lightbox").classList.add("open");
}
function closeLightbox() { $("lightbox").classList.remove("open"); }
$("lightbox").onclick = e => { if (e.target.id === "lightbox") closeLightbox(); };

document.addEventListener("keydown", e => {
  if (e.key === "Escape") return closeLightbox();
  if ($("lightbox").classList.contains("open")) return;
  const order = ["all", ...data.sessions.map(s => s.session)];
  const i = order.indexOf(state.session), t = TYPES.findIndex(x => x.key === state.type);
  if (e.key === "ArrowDown") { e.preventDefault(); set({session: order[Math.min(i + 1, order.length - 1)]}); }
  else if (e.key === "ArrowUp") { e.preventDefault(); set({session: order[Math.max(i - 1, 0)]}); }
  else if (e.key === "ArrowRight") set({type: TYPES[(t + 1) % TYPES.length].key});
  else if (e.key === "ArrowLeft") set({type: TYPES[(t - 1 + TYPES.length) % TYPES.length].key});
  else if (e.key.toLowerCase() === "g" && typeOf(state.type).good) set({good: !state.good});
});

fetch("/api/figures").then(r => r.json()).then(d => {
  data = d;
  for (const s of d.sessions) sessions[s.session] = s;
  for (const f of d.figures) byKey[`${f.session}|${f.scope}|${f.name}`] = f;
  $("summary").textContent = `${d.sessions.length} sessions · ${d.figures.length} figures`;
  readHash();
  render();
});
</script>
</body>
</html>
